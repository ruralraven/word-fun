<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;touch-action:none}
body{background:linear-gradient(#7ec8ff,#bfe8ff 60%,#9be37a 60%,#6cc94f);color:#333}
#top{position:fixed;top:0;left:0;right:0;height:70px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;z-index:5}
.btn{border:none;border-radius:22px;font-size:34px;width:60px;height:60px;background:#fff;box-shadow:0 5px 0 #0002;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}
#stars{font-size:30px;background:#fff;border-radius:30px;padding:8px 18px;box-shadow:0 5px 0 #0002;font-weight:bold;color:#f5a400}
.screen{position:fixed;inset:70px 0 0 0;display:none}.screen.on{display:block}
#menu.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.title{font-size:clamp(40px,10vw,80px);font-weight:900;color:#fff;text-shadow:0 5px 0 #ff5fa2,0 9px 0 #0002;margin:0}
.mode{width:min(85vw,420px);height:min(20vh,140px);border:none;border-radius:40px;font-size:clamp(50px,12vh,80px);box-shadow:0 9px 0 #0003;cursor:pointer;animation:bob 2s ease-in-out infinite}
.mode:active{transform:scale(.95)}
.m1{background:#ff6b9a}.m2{background:#ffd23f;animation-delay:.3s}.m3{background:#5ee08a;animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px)}}
.balloon{position:absolute;width:110px;height:135px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:#fff;text-shadow:0 3px 0 #0003;cursor:pointer;box-shadow:inset -12px -12px 0 #0002}
.balloon:after{content:"";position:absolute;bottom:-38px;left:54px;width:2px;height:38px;background:#fff8}
.pop{animation:pop .35s forwards}@keyframes pop{to{transform:scale(1.8);opacity:0}}
#bigl{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:200px;font-weight:900;color:#fff;text-shadow:0 8px 0 #ff5fa2;pointer-events:none;opacity:0;transition:opacity .3s}
#pic{font-size:clamp(90px,22vh,170px);text-align:center;margin-top:2vh;cursor:pointer}
#slots,#tiles{display:flex;justify-content:center;gap:14px;margin:2vh 0;flex-wrap:wrap}
.slot,.tile{width:min(26vw,110px);height:min(26vw,110px);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:min(16vw,70px);font-weight:900}
#slots{flex-wrap:nowrap;gap:10px}#slots.n4 .slot{width:min(21vw,110px);height:min(21vw,110px)}.slot{border:6px dashed #fff;background:#fff5;color:#fff}.slot.full{border-style:solid;background:#fff;color:#ff5fa2}
.tile{background:#fff;color:#3a7bd5;box-shadow:0 7px 0 #0003;cursor:grab;touch-action:none;position:relative;z-index:2}
.tile.drag{z-index:50;transform:scale(1.15)}.tile.used{visibility:hidden}
.tile.hint{animation:wig .6s 3}.tile.hint2{animation:wig .8s 1}.slot.ghost{color:#fff9}@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#ask{text-align:center;font-size:clamp(60px,14vh,110px);margin-top:3vh;cursor:pointer;color:#fff;font-weight:900;text-shadow:0 6px 0 #3a7bd5}
#choices{display:flex;justify-content:center;gap:4vw;flex-wrap:wrap;margin-top:4vh;padding:0 10px}
.choice{width:min(40vw,170px);height:min(40vw,170px);border:none;border-radius:36px;font-size:min(24vw,110px);font-weight:900;color:#fff;box-shadow:0 9px 0 #0003;cursor:pointer;text-shadow:0 4px 0 #0003}
.shake{animation:wig .4s}.yay{animation:pop2 .5s}@keyframes pop2{50%{transform:scale(1.25)}}
#cheer{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%) scale(0);font-size:120px;z-index:60;pointer-events:none;transition:transform .3s}
#cheer.on{transform:translate(-50%,-50%) scale(1)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:55}
#start{position:fixed;inset:0;z-index:100;background:#7ec8ff;display:flex;align-items:center;justify-content:center;flex-direction:column}
#start button{font-size:90px;width:220px;height:220px;border-radius:50%;border:none;background:#ffd23f;box-shadow:0 12px 0 #0003;animation:bob 1.5s infinite}

body{background:#7ec8ff}body[data-m=find]{background:#0a4f8a}
.screen{z-index:2}#top{z-index:6}
.scene{position:fixed;inset:0;z-index:0;display:none;overflow:hidden;pointer-events:none}
body:not([data-m]) .sky,body[data-m=menu] .sky,body[data-m=pop] .sky{display:block}body[data-m=build] .garden,body[data-m=find] .sea{display:block}
.sky{background:linear-gradient(#5db8ff,#bfe8ff 70%)}.garden{background:linear-gradient(#8fd3ff,#d6f1ff 55%)}
.sun{position:absolute;right:6%;top:9%;width:90px;height:90px;border-radius:50%;background:radial-gradient(#fff6a8,#ffd23f 60%,#ffb01f);box-shadow:0 0 0 14px #ffe14d55,0 0 0 28px #ffe14d22;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 20px #ffe14d55,0 0 0 40px #ffe14d22}}
.rainbow{position:absolute;left:-10%;bottom:22%;width:70%;opacity:.55}
.cloud{position:absolute;width:130px;height:44px;background:#fff;border-radius:40px;box-shadow:0 6px 0 #dbeefd;animation:drift 38s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:60px;height:60px;left:18px;top:-30px}.cloud:after{width:46px;height:46px;left:66px;top:-20px}
.c1{top:16%;animation-delay:-5s}.c2{top:30%;transform:scale(.7);animation-duration:52s;animation-delay:-30s}.c3{top:8%;transform:scale(.5);animation-duration:60s;animation-delay:-45s}
@keyframes drift{from{left:-160px}to{left:110%}}
.bird{position:absolute;width:34px;animation:fly 24s linear infinite,flap .5s ease-in-out infinite alternate}.b1{top:22%}.b2{top:26%;width:24px;animation-delay:-8s,-.2s}
@keyframes fly{from{left:-50px}to{left:110%}}@keyframes flap{to{transform:scaleY(.4)}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:42%}
.grass{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(#8ee06a,#5cbf45);border-top:8px solid #a6ec82}
.fence{position:absolute;left:0;bottom:39%;width:100%;height:60px}
.flowers span{position:absolute;bottom:3%;font-size:40px;animation:sway 3s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(8deg)}}
.bfly{position:absolute;font-size:34px;animation:bf 14s ease-in-out infinite}@keyframes bf{0%{left:5%;top:50%}25%{left:60%;top:35%}50%{left:85%;top:55%}75%{left:30%;top:45%}100%{left:5%;top:50%}}
.sea{background:linear-gradient(#3fc1ff,#1479c9 60%,#0a4f8a)}
.rays{position:absolute;inset:0;background:repeating-linear-gradient(100deg,#ffffff14 0 40px,transparent 40px 110px);animation:ray 8s ease-in-out infinite alternate}@keyframes ray{to{transform:translateX(40px)}}
.fish{position:absolute;font-size:46px;animation:swim 18s linear infinite}.f1{top:24%}.f2{top:58%;animation-duration:24s;animation-delay:-9s;font-size:38px}.f3{top:72%;animation-duration:30s;animation-delay:-4s}.f4{top:14%;animation-duration:26s;animation-delay:-16s;font-size:54px}
@keyframes swim{from{left:110%;transform:translateY(0)}50%{transform:translateY(-20px)}to{left:-80px;transform:translateY(0)}}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid #ffffffaa;background:radial-gradient(circle at 30% 30%,#fff9,#fff1 60%);animation:rise 7s linear infinite}
@keyframes rise{to{transform:translate(20px,-110vh)}}
.reef{position:absolute;left:0;bottom:0;width:100%;height:24%}.weed path{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
#ask{text-shadow:0 6px 0 #0a4f8a,0 0 20px #fff6}
.choice{border:5px solid #fff8;background-image:radial-gradient(circle at 30% 25%,#fff8,transparent 40%)!important}
/* menu */
.mhead{display:flex;align-items:center;gap:6px}.mhead .owl{width:min(22vw,110px)}
.wave span{display:inline-block;animation:wv 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*.1s)}
.wave span:nth-child(3n+1){text-shadow:0 5px 0 #ff5fa2,0 9px 0 #0002}.wave span:nth-child(3n+2){text-shadow:0 5px 0 #4fa8ff,0 9px 0 #0002}.wave span:nth-child(3n){text-shadow:0 5px 0 #ffb01f,0 9px 0 #0002}
@keyframes wv{50%{transform:translateY(-10px) rotate(-4deg)}}
#menu.on{gap:16px}.mode{height:min(15vh,120px);border:5px solid #fff9}
.shelfbox{background:#fff8;border:4px solid #fff;border-radius:24px;padding:8px 10px;width:min(90vw,440px);box-shadow:0 6px 0 #0002}
#shelf{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-bottom:8px solid #c98f52;padding-bottom:6px}
.stk{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:#0001;color:#0003;font-weight:900}
.stk.got{color:#000;background:#fff;box-shadow:0 3px 0 #0002;border:3px solid #ffd23f}
.next{display:flex;align-items:center;gap:8px;font-size:24px;margin-top:6px}.track{flex:1;height:16px;background:#fff;border-radius:10px;overflow:hidden}#nextbar{height:100%;background:linear-gradient(90deg,#ffd23f,#ff9b3f);border-radius:10px;transition:width .4s}
/* owl */
.owl{overflow:visible}.owlb{animation:bounce 1.8s ease-in-out infinite;transform-origin:60px 130px}
@keyframes bounce{50%{transform:translateY(-6px) scaleY(1.02)}}
.lid{transform:scaleY(0);transform-origin:center 40px;transform-box:fill-box;animation:blink 4s infinite}.lid ellipse{transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.owl.cheer .owlb{animation:hop .5s ease-out 3}.owl.cheer .wl{animation:wing .25s 6 alternate;transform-origin:30px 78px}.owl.cheer .wr{animation:wing2 .25s 6 alternate;transform-origin:90px 78px}
@keyframes hop{50%{transform:translateY(-26px)}}@keyframes wing{to{transform:rotate(40deg)}}@keyframes wing2{to{transform:rotate(-40deg)}}
.bowl{position:absolute;left:2%;bottom:2%;width:min(24vw,120px);z-index:1;pointer-events:none}
/* picture */
#pic span{display:inline-block;animation:pb 2s ease-in-out infinite;filter:drop-shadow(0 10px 0 #0002)}
@keyframes pb{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.06,.96)}60%{transform:translateY(0) scale(.97,1.04)}}
/* wooden blocks */
.tile{background:linear-gradient(145deg,#ffe2b0,#e7b36f 55%,#cf914a);border-radius:18px;box-shadow:inset 0 5px 0 #fff7,inset 5px 0 0 #fff3,inset 0 -7px 0 #a8692e,inset -5px 0 0 #b97a3a,0 8px 0 #7a4a1e,0 14px 12px #0004;text-shadow:0 3px 0 #0003,0 -1px 0 #fff8;-webkit-text-stroke:2px #fff}
.tile:before{content:"";position:absolute;inset:10px;border:3px dashed #a8692e44;border-radius:12px}
.slot{background:#fff6;box-shadow:inset 0 6px 10px #0001}.slot.full{background:linear-gradient(145deg,#fff,#fde9f3);box-shadow:0 6px 0 #e3a6c4}
/* balloons */
.balloon{background-image:radial-gradient(circle at 32% 26%,#fffc 0 9%,#fff5 14%,transparent 34%),radial-gradient(circle at 70% 80%,#0003,transparent 55%)!important;box-shadow:none}
.balloon:before{content:"";position:absolute;bottom:-9px;left:47px;border:8px solid transparent;border-bottom:11px solid;border-bottom-color:inherit;border-top:0;filter:brightness(.8)}
.balloon:after{background:none;width:22px;height:70px;bottom:-78px;left:44px;border-left:2px solid #fffa;border-radius:50% 0 0 50%;transform:skewX(8deg)}
/* burst */
.burst{position:fixed;width:20px;height:20px;margin:-10px;z-index:56;pointer-events:none;border-radius:50%;background:repeating-conic-gradient(#ffd23f 0 12deg,transparent 12deg 30deg);animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:scale(1) rotate(0);opacity:1}to{transform:scale(28) rotate(60deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.lid{transform:scaleY(0)}.burst{display:none}}
